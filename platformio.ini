; SparkFun LoRa Gateway 1-Channel (ESP32), WRL-15006.
;
; LAYOUT
;   lib/        this project's own shared libraries -- committed. PlatformIO
;               links whichever ones an application #includes.
;   src/apps/   full applications
;   src/tools/  small single-purpose utilities
;   vendor/     third-party libraries, fetched by scripts/fetch-libraries.sh
;               and gitignored. NOT lib/ -- that is ours.
;   test/       unit tests, `pio test`
;
; One environment per application. build_src_filter picks exactly one main(),
; because PlatformIO compiles everything under src/ otherwise and two main()s
; will not link.
;
; THERE IS NO BOARD DEFINITION FOR THIS HARDWARE and you must not borrow one.
; `esp32dev` supplies the MCU, flash size and upload protocol only; every radio
; pin comes from lib/board/board.h. Stock ESP32 + SX127x targets assume VSPI
; with NSS 18, this board is SCK 14 / MISO 12 / MOSI 13 / NSS 16, and the
; mismatch fails silently -- the radio initialises and hears nothing.

; Common to every environment, including the host-side tests.
[env]
build_flags = -DCORE_DEBUG_LEVEL=0

; Base for everything that runs ON the board. The native test environment must
; NOT inherit `board`, so these settings cannot live in [env] -- PlatformIO
; applies [env] to every environment, and the native platform rejects
; 'esp32dev' with "Unknown board ID".
[esp32]
platform  = espressif32
board     = esp32dev
framework = arduino

board_build.flash_mode  = dio
board_upload.flash_size = 4MB

; 115200 both ways. The CH340C fails esptool's stub loader at 921600 and
; 460800; at 115200 the stub is fine, which is why uploads run far faster than
; the --no-stub reads the shell scripts are stuck with.
monitor_speed = 115200
upload_speed  = 115200

; NO hardcoded port. /dev/ttyUSBn is assigned in enumeration order, and this
; board needs power cycling often enough (see the GPIO12 note in CLAUDE.md)
; that the number moves -- it went ttyUSB1 -> ttyUSB2 mid-session on
; 2026-08-21, breaking every hardcoded path while the autodetecting shell
; scripts carried on working.
;
; `make` supplies the port, detected by vendor/model (1a86:7523) via
; scripts/find-port.sh. That survives both renumbering and moving the cable,
; which /dev/serial/by-path/ does not.
;
; Running pio directly? Pass it yourself, because PlatformIO's own autodetect
; has a CP2102N (the sibling Heltec board) and a ttyACM to choose from as well:
;   pio run -e listen -t upload --upload-port $(./scripts/find-port.sh)

monitor_filters = time, esp32_exception_decoder

; Show what you type. `pio device monitor` does NOT echo local input by
; default, so typing a command into the gateway's serial console produces a
; blank line and no feedback -- you cannot tell a typo from a dead port.
; The board does not echo either, because echoing a password back is exactly
; what this project is trying to stop doing.
monitor_echo = yes

; NOTE: there is no monitor_menu_char option. PlatformIO's project options are
; monitor_baud/dir/dtr/echo/encoding/eol/filters/parity/port/raw/rts/speed --
; and its INI parser accepts unknown keys silently, so an invented one looks
; accepted by `pio project config` and does nothing. The menu key is CLI-only;
; the Makefile passes --menu-char.

lib_extra_dirs = vendor

build_flags = -DCORE_DEBUG_LEVEL=0

; ---------------------------------------------------------------- applications

; Listen and echo to serial. Nothing else -- no WiFi, no framing, no stats.
; Safe with no antenna: it only receives.
[env:listen]
extends = esp32
build_src_filter = +<apps/listen/>

; WiFi + HTTP + LoRa receive. Credentials are typed over serial into NVS, never
; compiled in. Safe with no antenna: it only receives.
[env:gateway]
extends = esp32
build_src_filter = +<apps/gateway/>

; Two-radio link test. Build `rx` on one board and `tx` on the other.
[env:rx]
extends = esp32
build_src_filter = +<apps/link/>

[env:tx]
extends = esp32
build_src_filter = +<apps/link/>
build_flags = ${env.build_flags} -DROLE_TX

; Same beacon at minimum power, for two radios on one bench. The listener's
; lab mode is a runtime toggle instead -- see src/apps/listen.
[env:tx-lab]
extends = esp32
build_src_filter = +<apps/link/>
build_flags = ${env.build_flags} -DROLE_TX -DLAB_MODE

; ---------------------------------------------------------------------- tools

; Does the radio answer, and on which SPI wiring? Run this first on any board
; that has gone quiet.
[env:probe]
extends = esp32
build_src_filter = +<tools/probe/>

; Frequency agreed, both ends running, nothing arriving? Sweep the modulation
; grid at 915.0 -- SF7-12 x BW 125/250 x sync 0x12/0x34 -- and find out which
; parameter disagrees.
[env:sweep]
extends = esp32
build_src_filter = +<tools/sweep/>

; Sweep known LoRaWAN/Meshtastic/link-test settings and report what is heard.
[env:scan]
extends = esp32
build_src_filter = +<tools/scan/>

; ---------------------------------------------------------------------- tests

; Host-side unit tests for the pure arithmetic in lib/loramath. Runs on the
; workstation, needs no board, and is what `make test` invokes. Anything that
; needs the radio is an integration test and belongs in scripts/.
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -std=c++17
